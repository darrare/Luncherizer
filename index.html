<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Luncherizer 🕹️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🕹️</text></svg>">

  <!-- Bootstrap & jQuery -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Pixel Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <style>
    body {
      background-color: #000;
      color: #0ff;
      font-family: 'Press Start 2P', cursive;
      text-align: center;
      padding: 30px 10px;
    }

    h1 {
      color: #f0f;
      font-size: 1.8rem;
      text-shadow: 0 0 10px #0ff, 0 0 20px #f0f;
      margin-bottom: 20px;
    }

    .filters select {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.6rem;
      margin: 5px;
      background: #111;
      color: #0ff;
      border: 2px solid #0ff;
      border-radius: 6px;
      padding: 6px;
      text-transform: uppercase;
    }

    .btn-arcade {
      margin-top: 20px;
      background: #f0f;
      color: black;
      font-size: 0.9rem;
      padding: 15px 25px;
      border: 3px solid #0ff;
      border-radius: 10px;
      text-shadow: none;
      box-shadow: 0 0 15px #f0f;
    }

    .btn-arcade:hover {
      background: #ff00cc;
      box-shadow: 0 0 25px #f0f;
    }

    .results {
      margin-top: 50px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      align-items: center;
    }

    .card-arcade {
      width: 90%;
      max-width: 500px;
      background: #111;
      border: 4px double #0ff;
      border-radius: 12px;
      padding: 20px;
      color: #0ff;
      box-shadow: 0 0 20px #0ff;
      opacity: 0;
      transform: scale(0.7);
    }

    .gold { border-color: gold; color: gold; }
    .silver { border-color: silver; color: silver; }
    .bronze { border-color: #cd7f32; color: #cd7f32; }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .footer {
      margin-top: 60px;
      font-size: 0.5rem;
      color: #666;
    }

    @media (max-width: 480px) {
        h1 { font-size: 1.2rem; }
        .filters select {
            font-size: 0.5rem;
            padding: 4px;
        }
        .btn-arcade {
            font-size: 0.7rem;
            padding: 10px 18px;
        }
        .card-arcade {
            font-size: 0.6rem;
        }
        }
  </style>
</head>
<body>

  <h1>Luncherizer 🕹️</h1>
  <p style="font-size: 0.6rem; color: #aaa;">Insert coin to find your next meal</p>

  <div class="filters">
    <select id="cuisine">
    <option value="fast food">Fast Food</option>
      <option value="">Any Cuisine</option>
      <option value="mexican">Mexican</option>
      <option value="chinese">Chinese</option>
      <option value="pizza">Pizza</option>
      <option value="burgers">Burgers</option>
      <option value="japanese">Japanese</option>
      <option value="thai">Thai</option>
      <option value="indian">Indian</option>
    </select>

    <select id="radius">
      <option value="1600">1 mi</option>
      <option value="4800" selected>3 mi</option>
      <option value="8000">5 mi</option>
      <option value="16000">10 mi</option>
    </select>

    <select id="price">
      <option value="">Any Price</option>
      <option value="0">$</option>
      <option value="1">$$</option>
      <option value="2">$$$</option>
      <option value="3">$$$$</option>
    </select>
  </div>

  <button id="go" class="btn btn-arcade">🎯 GO!</button>

  <div class="results d-none" id="results">
    <div id="gold" class="card-arcade gold"></div>
    <div id="silver" class="card-arcade silver"></div>
    <div id="bronze" class="card-arcade bronze"></div>
  </div>

  <div class="footer">darrare.github.io/Luncherizer Ⓒ 2025</div>

  <script>
    function formatPlace(place) {
        const mapsUrl = `https://maps.google.com/?q=place_id:${place.place_id}`;
        return `
            <a href="${mapsUrl}" target="_blank" style="text-decoration: none; color: inherit;">
            <div style="font-size:0.8rem;">${place.name}</div>
            <div style="font-size:0.6rem;">${"$".repeat(place.price_level || 1)} | <span style="font-size:1rem;">⭐</span> ${place.rating || "?"}</div>
            <div style="font-size:0.6rem;">${place.vicinity}</div>
            </a>
        `;
    }

    function reveal($el, place, delay) {
      $el
        .html(formatPlace(place))
        .css({ animation: `reveal 0.5s ease-out ${delay}s forwards` });
    }

    $('#go').click(() => {
      $('.results').removeClass('d-none');
      $('.card-arcade').html("🕹️ Loading...").css({ opacity: 0, transform: "scale(0.7)" });
      
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const radius = $('#radius').val();
        const keyword = $('#cuisine').val();
        const price = $('#price').val();

        const apiUrl = `https://luncherizer.ryandarras.workers.dev/?lat=${lat}&lng=${lng}&radius=${radius}&keyword=${keyword}&minprice=${price}&maxprice=${price}`;

        $.getJSON(apiUrl, data => {
          const places = data.results.filter(p => p.rating >= 3.5);
          if (places.length < 3) {
            alert("Not enough choices. Try different filters!");
            return;
          }

          const [gold, silver, bronze] = getRandomChoices(places, 3);
          reveal($('#gold'), gold, 0.2);
          reveal($('#silver'), silver, 0.5);
          reveal($('#bronze'), bronze, 0.8);
        });
      }, () => {
        alert("Please enable location services.");
      });
    });

    function getRandomChoices(arr, count) {
        const shuffled = arr.sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count);
    }
  </script>
</body>
</html>
